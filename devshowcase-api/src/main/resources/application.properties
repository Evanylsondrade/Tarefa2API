spring.application.name=devshowcase-api

# ==========================================
# Configuracao do banco de dados PostgreSQL (Produção / Desenvolvimento)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devshowcase}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Configuracao JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Configuracao do servidor (Porta dinâmica para PaaS como Render/Heroku)
# ==========================================
server.port=${PORT:8080}

# ==========================================
# Mensagens de erro detalhadas
# ==========================================
server.error.include-message=always
server.error.include-binding-errors=always

# ==========================================
# Swagger / SpringDoc OpenAPI UI
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
